[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[project]
name = "ensembl_tui"
version = "0.7.9"
description = "Ensembl terminal user interface tools"
authors = [
    { name = "Gavin Huttley", email = "Gavin.Huttley@anu.edu.au" },
    { name = "Arne Becker", email = "arne@ebi.ac.uk" },
    { name = "Stefano Giorgetti", email = "sgiorgetti@ebi.ac.uk" },
]
maintainers = [
    { name = "Gavin Huttley", email = "Gavin.Huttley@anu.edu.au" },
    { name = "Arne Becker", email = "arne@ebi.ac.uk" },
    { name = "Stefano Giorgetti", email = "sgiorgetti@ebi.ac.uk" },
]
keywords = ["biology", "genomics", "evolution", "bioinformatics"]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "click",
    "cogent3>=2026.1.12a1",
    "cogent3-h5seqs==0.7.3",
    "duckdb",
    "numba",
    "numpy",
    "polars",
    "pyarrow",
    "scinexus[rich]",
    "scitrack",
    "typing_extensions",
    "trogon",
    "unsync",
    # restricting wakepy to macOS for now
    "wakepy>0.7; os_name == 'darwin'",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Documentation = "https://ensembl-tui.readthedocs.io/"
"Bug Tracker" = "https://github.com/cogent3/ensembl_tui/issues"
"Source Code" = "https://github.com/cogent3/ensembl_tui"

[project.scripts]
eti = "ensembl_tui.cli:main"

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "ruff==0.16.6",
    "nox",
]
doc = [
    "mkdocs>=1.6.1",
    "markdown-exec[ansi]>=1.10.0",
    "mkdocs-jupyter>=0.25.1",
    "markdown>=3.7",
    "mdformat",
    "mdformat-mkdocs",
    "mdformat-black",
]
dev = [
    "cogapp",
    "numpydoc",
    "psutil",
    "scriv",
    { include-group = "doc" },
    { include-group = "test" },
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "internet: marks tests that require internet access  (deselect with '-m \"not internet\"')",
]
norecursedirs = ["doc", ".nox", "working"]
addopts = ["--strict-config"]
testpaths = "tests"

[tool.scriv]
format = "md"
categories = [
    "Contributors",
    "ENH",
    "BUG",
    "DOC",
    "Deprecations",
    "Discontinued",
]
output_file = "changelog.md"
version = "literal: pyproject.toml: project.version"
skip_fragments = "README.*"
new_fragment_template = "file: changelog.d/templates/new.md.j2"
entry_title_template = "file: changelog.d/templates/title.md.j2"

[tool.uv]
reinstall-package = ["cogent3"]

[tool.uv.build-backend]
# flit only ever shipped VCS-tracked files, but uv_build does not consult the
# VCS. tests/data accumulates tens of GB of fixture data downloaded during test
# runs, and a glob that matches one of those directories pulls in its whole
# subtree, so match the checked-in fixtures by extension instead.
source-include = [
    "tests/*.py",
    "tests/data/*.cfg",
    "tests/data/*.emf",
    "tests/data/*.fasta",
    "tests/data/*.gff3",
    "tests/data/*.gz",
    "tests/data/*.maf",
    "tests/data/*.nh",
    "tests/data/*.tsv",
    "tests/data/sample-CHECKSUMS",
    "tests/data/sample-MD5SUM",
    "tests/data/prep_tests_data/*.cfg",
    "tests/data/prep_tests_data/*.py",
]
# tool caches can sit inside src/ensembl_tui and would otherwise be packaged
source-exclude = [
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/__pycache__",
]
wheel-exclude = [
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/__pycache__",
]
